<html>
    <head>
        <style>
            .container {
                font-family: Arial, sans-serif;
                color: #333;
                background-color: #f9f9f9;
                padding: 30px;
                max-width: 400px;
                margin: auto;
                border-radius: 8px;
                border: 1px solid #ddd;
                box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            }
            .header {
                font-size: 28px;
                font-weight: bold;
                color: #333;
                text-align: center;
            }
            .content {
                font-size: 16px;
                line-height: 1.6;
                text-align: center;
                color: #555;
                margin-top: 20px;
            }
            .button-container {
                text-align: center;
                margin-top: 30px;
            }
            .button {
                background-color: #FFC107;
                color: #2D2D2D;
                padding: 12px 24px;
                border-radius: 5px;
                text-decoration: none;
                font-weight: bold;
                font-size: 16px;
            }
            .signature {
                font-size: 14px;
                color: #333;
                text-align: center;
                margin-top: 30px;
            }
            .footer {
                font-size: 12px;
                color: #777;
                text-align: center;
                margin-top: 20px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">Confirm Your Email Address</div>
            <div class="content">
                To complete your request to update your email address, please confirm by clicking the button below.
            </div>
            <div class="button-container">
                <a class="button" href="http://localhost:8080/change-email?token={payload}">Confirm Email</a>
            </div>
            <div class="signature">Warm regards,<br>SECRAG Team</div>
            <div class="footer">If you did not request this change, please disregard this message.</div>
        </div>
    </body>
</html>
